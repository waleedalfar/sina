[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "hospital-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008 (function call in default argument) is the standard FastAPI
# Depends() idiom, not a bug — ignored project-wide rather than
# per-line-ignored dozens of times.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in app/core/db.py is created at import time and its asyncpg
# connections are bound to whatever loop first touched them. Without a
# single session-wide loop, pytest-asyncio gives each test a fresh one and
# every reused connection fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs queries inside greenlets, and coverage's
# default tracer loses the frame across that switch — so every endpoint body
# after its first `await db.…` was reported as unexecuted even when a test
# provably ran it (an endpoint returning 201 showed as 0% covered). Without
# this the numbers understate reality by roughly 25 points.
concurrency = ["greenlet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
