services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted OIDC identity provider — ADR-0004. Backend never sees a
  # password; it only validates tokens Keycloak issues. Realm/clients/test
  # users are seeded from realm-export.json on every startup (--import-realm)
  # so a fresh checkout gets a working dev environment with no manual setup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the issuer instead of deriving it from each request's Host
      # header (Keycloak 26's default). Without this, a token obtained by
      # the backend via the docker-network hostname (`keycloak:8080`) and a
      # token obtained by the browser via the published port
      # (`localhost:8080`, for the frontend's real OIDC login flow) would
      # carry two different `iss` claims — only one of which the backend's
      # strict issuer check (see identity/security.py) would ever accept.
      # Pinning makes the issuer stable regardless of which network path
      # reached Keycloak. See identity.md's Revision Log.
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Malware scanning at model import — models.md's design decision: hard
  # block on a positive detection, no override. Self-hosted, consistent
  # with every other dependency in this stack (ADR-0001/0002/0004/0005).
  clamav:
    image: clamav/clamav:latest
    # No native arm64 image published upstream — emulated via Docker
    # Desktop on Apple Silicon. Dev-only concession; unrelated to any
    # design decision in models.md.
    platform: linux/amd64
    ports:
      - "3310:3310"
    healthcheck:
      # clamd can take a couple of minutes on first boot while freshclam
      # pulls virus definitions — generous start_period/retries for that.
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s

  # Local model runtime (ADR-0001). MVP 0.1 treats this as a single shared
  # runtime the `models` module registers/unloads GGUF files against — see
  # models.md's Ollama integration notes, not per-version container
  # orchestration (explicitly Phase 2+).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - model_files:/models
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Gateway rate-limit counters — ADR-0005. Ephemeral, single purpose; no
  # other module uses Redis (see that ADR's MVP vs Future).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime_dev_password@postgres:5432/hospital_platform
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hospital_platform
      # Must match Keycloak's pinned KC_HOSTNAME above (what any token's
      # `iss` claim will actually contain), not the docker-network hostname
      # the backend uses to *reach* Keycloak — those are allowed to differ.
      OIDC_ISSUER: http://localhost:8080/realms/hospital-platform
      OIDC_JWKS_URL: http://keycloak:8080/realms/hospital-platform/protocol/openid-connect/certs
      OIDC_AUDIENCE: hospital-platform-backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_STORAGE_DIR: /models
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - model_files:/models
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Browser SPA — see docs/modules/frontend.md. Talks to Keycloak and the
  # backend directly from the browser at their published host ports (not
  # the docker-network hostnames), so its env vars are host-perspective,
  # unlike every other service's config in this file.
  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_OIDC_AUTHORITY: http://localhost:8080/realms/hospital-platform
      NEXT_PUBLIC_OIDC_CLIENT_ID: hospital-platform-web
      NEXT_PUBLIC_OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  model_files:
  frontend_node_modules:
  frontend_next_cache:
