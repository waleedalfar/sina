services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted OIDC identity provider — ADR-0004. Backend never sees a
  # password; it only validates tokens Keycloak issues. Realm/clients/test
  # users are seeded from realm-export.json on every startup (--import-realm)
  # so a fresh checkout gets a working dev environment with no manual setup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime_dev_password@postgres:5432/hospital_platform
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hospital_platform
      OIDC_ISSUER: http://keycloak:8080/realms/hospital-platform
      OIDC_JWKS_URL: http://keycloak:8080/realms/hospital-platform/protocol/openid-connect/certs
      OIDC_AUDIENCE: hospital-platform-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
