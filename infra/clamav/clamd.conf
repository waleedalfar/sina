# The image's own clamd.conf settings, plus the scan limits from ADR-0006.
# Mounted over /etc/clamav/clamd.conf by docker-compose.yml.

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Scan limits (ADR-0006). 2047M, not 2048M: ClamAV cannot scan files of
# 2 GB or more, and 2048M is exactly 2^31 bytes. The backend's
# model_scan_max_bytes must equal this value; anything larger takes the
# publisher-checksum tier instead and is never sent here.
StreamMaxLength 2047M
MaxFileSize 2047M
MaxScanSize 2047M
# Regex-based signatures have their own size limit (default 100M), and
# AlertExceedsMax does not cover it: past it, those signatures are skipped
# and the scan still says OK. Raised to match, so "scanned" means every
# signature ran over the whole file.
PCREMaxFileSize 2047M
# Report content skipped for exceeding a limit as a detection
# (Heuristics.Limits.Exceeded.*) instead of OK. Without this, clamd says
# OK for bytes it never looked at.
AlertExceedsMax yes
# 15 minutes. With AlertExceedsMax on, a scan that runs out of time is a
# positive, so the default 2 minutes would block legitimate 2 GB models on
# slower hosts (including the emulated amd64 image on Apple Silicon).
MaxScanTime 900000
